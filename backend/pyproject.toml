[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yordamchi-buxgalter-backend"
version = "0.1.0"
description = "Yordamchi Buxgalter AI - Uzbekistan Financial Accounting Engine"
authors = [{ name = "Yordamchi AI Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5"
]
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = "test_*.py"

