name: Accounting & Audit Platform CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Pytest & Arithmetic Integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # same as backend/Dockerfile and local .venv
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        # No fallback: a broken requirements.txt must fail the build, not be masked
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        # tests/conftest.py forces an isolated temporary SQLite database and a test SECRET_KEY
        run: |
          pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Modules
        run: npm ci

      - name: Next.js Production Build
        run: npm run build
